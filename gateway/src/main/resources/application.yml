server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-create
              uri: ${polaris.gateway.routes.order-service-uri:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders
                - Method=POST
            - id: order-read
              uri: ${polaris.gateway.routes.order-service-uri:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders/{orderId}
                - Method=GET
            - id: order-public-api
              uri: ${polaris.gateway.routes.order-service-uri:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders/**
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${POLARIS_OAUTH_ISSUER_URI:http://localhost:8089/realms/polaris}
          jwk-set-uri: ${POLARIS_OAUTH_JWK_SET_URI:http://localhost:8089/realms/polaris/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
        grpc.server.processing.duration: true
        grpc.client.processing.duration: true
      minimum-expected-value:
        http.server.requests: 1ms
        grpc.server.processing.duration: 1ms
        grpc.client.processing.duration: 1ms
      maximum-expected-value:
        http.server.requests: 10s
        grpc.server.processing.duration: 10s
        grpc.client.processing.duration: 10s
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${POLARIS_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${POLARIS_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: polaris
      deployment.environment: ${POLARIS_DEPLOYMENT_ENVIRONMENT:local}

logging:
  structured:
    format:
      console: ecs

polaris:
  gateway:
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Request-Id
      exposed-headers:
        - Idempotency-Replayed
        - X-Request-Id
      allow-credentials: true
      max-age: 1h
    rate-limit:
      enabled: true
      backend: in-memory
      requests-per-window: 120
      window: 1m
      key-header: X-Forwarded-For

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-create
              uri: http://order-service:8081
              predicates:
                - Path=/api/v1/orders
                - Method=POST
            - id: order-read
              uri: http://order-service:8081
              predicates:
                - Path=/api/v1/orders/{orderId}
                - Method=GET
            - id: order-public-api
              uri: http://order-service:8081
              predicates:
                - Path=/api/v1/orders/**
  data:
    redis:
      host: redis

polaris:
  gateway:
    rate-limit:
      backend: redis
