# Scenario-driven tests of the deployed rules, including all-alert negative assertions.
rule_files:
- ../polaris-alerts.yml
evaluation_interval: 15s
tests:
- name: healthy snapshots and no requests do not manufacture failures
  interval: 15s
  external_labels:
    environment: alert-test
  input_series:
  - series: up{job="gateway",instance="one"}
    values: 1x80
  - series: up{job="order-service",instance="one"}
    values: 1x80
  - series: up{job="inventory-service",instance="one"}
    values: 1x80
  - series: up{job="notification-service",instance="one"}
    values: 1x80
  - series: polaris_observability_snapshot_success{job="order-service",instance="one"}
    values: 1x80
  - series: polaris_observability_snapshot_timestamp_seconds{job="order-service",instance="one"}
    values: 0+15x80
  - series: polaris_outbox_events{job="order-service",instance="one",status="PENDING"}
    values: '0x80'
  - series: polaris_outbox_events{job="order-service",instance="one",status="RETRY"}
    values: '0x80'
  - series: polaris_outbox_events{job="order-service",instance="one",status="FAILED"}
    values: '0x80'
  - series: polaris_outbox_events{job="order-service",instance="one",status="PUBLISHED"}
    values: '0x80'
  - series: polaris_outbox_oldest_age_seconds{job="order-service",instance="one"}
    values: '0x80'
  - series: polaris_pending_orders{job="order-service",instance="one"}
    values: '0x80'
  - series: polaris_pending_order_oldest_age_seconds{job="order-service",instance="one"}
    values: '0x80'
  - series: polaris_observability_snapshot_success{job="inventory-service",instance="one"}
    values: 1x80
  - series: polaris_observability_snapshot_timestamp_seconds{job="inventory-service",instance="one"}
    values: 0+15x80
  - series: polaris_outbox_events{job="inventory-service",instance="one",status="PENDING"}
    values: '0x80'
  - series: polaris_outbox_events{job="inventory-service",instance="one",status="RETRY"}
    values: '0x80'
  - series: polaris_outbox_events{job="inventory-service",instance="one",status="FAILED"}
    values: '0x80'
  - series: polaris_outbox_events{job="inventory-service",instance="one",status="PUBLISHED"}
    values: '0x80'
  - series: polaris_outbox_oldest_age_seconds{job="inventory-service",instance="one"}
    values: '0x80'
  - series: polaris_observability_snapshot_success{job="notification-service",instance="one"}
    values: 1x80
  - series: polaris_observability_snapshot_timestamp_seconds{job="notification-service",instance="one"}
    values: 0+15x80
  - series: polaris_notification_inbox_events{job="notification-service",instance="one",status="PROCESSING"}
    values: '0x80'
  - series: polaris_notification_inbox_events{job="notification-service",instance="one",status="PROCESSED"}
    values: '0x80'
  - series: polaris_notification_inbox_events{job="notification-service",instance="one",status="DEAD_LETTERED"}
    values: '0x80'
  alert_rule_test:
  - eval_time: 8m
    alertname: PolarisServiceScrapeUnavailable
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisBusinessTelemetryUnavailable
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisOrderApiSystemErrors
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisInventoryRpcSystemErrors
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisPendingOrdersStalled
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisOutboxStalled
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisOutboxFailed
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisNotificationFailures
    exp_alerts: []
  - eval_time: 8m
    alertname: PolarisNotificationProcessingLate
    exp_alerts: []
