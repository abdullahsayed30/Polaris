      - series: "polaris_notification_freshness_seconds_bucket{event_type=\"OrderCreated\",instance=\"new\",job=\"notification-service\",le=\"+Inf\"}"
        values: "0+10x5"
      - series: "polaris_notification_freshness_seconds_count{event_type=\"OrderCreated\",instance=\"new\",job=\"notification-service\"}"
        values: "0+10x5"
      - series: "polaris_notification_freshness_overflow_total{event_type=\"OrderCreated\",instance=\"new\",job=\"notification-service\"}"
        values: "0+1x5"
    promql_expr_test:
      - expr: "histogram_quantile(0.95,sum by(le,event_type) (rate(polaris_notification_freshness_seconds_bucket[5m]) and on(job,instance,event_type) rate(polaris_notification_freshness_seconds_bucket{le=\"604800.0\"}[5m]))) and on(event_type) (sum by(event_type) (rate(polaris_notification_freshness_seconds_bucket{le=\"604800.0\"}[5m])) >= 0.95 * (sum by(event_type) (rate(polaris_notification_freshness_seconds_count[5m]) and on(job,instance,event_type) rate(polaris_notification_freshness_seconds_bucket{le=\"604800.0\"}[5m])) > 0))"
        eval_time: 5m
        exp_samples: []
      - expr: "sum by(event_type) (increase(polaris_notification_freshness_overflow_total[5m]))"
        eval_time: 5m
        exp_samples:
          - labels: "{event_type=\"OrderCreated\"}"
            value: 5
  - name: "rolling upgrade excludes old replicas without the seven-day bucket"
