{{- if .Values.networkPolicy.enabled }}
{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "polaris.serviceName" (dict "root" $ "service" $serviceName) }}
  labels:
    {{- include "polaris.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  podSelector:
    matchLabels:
      {{- include "polaris.selectorLabels" (dict "root" $ "service" $serviceName) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if eq $serviceName "gateway" }}
    - from:
        {{- toYaml $.Values.networkPolicy.gatewayIngressFrom | nindent 8 }}
      ports:
        - port: {{ $service.httpPort }}
          protocol: TCP
    {{- else if eq $serviceName "order-service" }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "polaris.selectorLabels" (dict "root" $ "service" "gateway") | nindent 14 }}
      ports:
        - port: {{ $service.httpPort }}
          protocol: TCP
    {{- else if eq $serviceName "inventory-service" }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "polaris.selectorLabels" (dict "root" $ "service" "order-service") | nindent 14 }}
      ports:
        - port: {{ $service.grpcPort }}
          protocol: TCP
    {{- end }}
    - from:
        {{- toYaml $.Values.networkPolicy.monitoringIngressFrom | nindent 8 }}
      ports:
        - port: {{ $service.httpPort }}
          protocol: TCP
  egress:
    {{- if $.Values.networkPolicy.egress.allowAll }}
    - {}
    {{- else }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{ $.Values.networkPolicy.egress.dnsPodSelector.key }}: {{ $.Values.networkPolicy.egress.dnsPodSelector.value }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if eq $serviceName "gateway" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "polaris.selectorLabels" (dict "root" $ "service" "order-service") | nindent 14 }}
      ports:
        - port: {{ (index $.Values.services "order-service").httpPort }}
          protocol: TCP
    {{- else if eq $serviceName "order-service" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "polaris.selectorLabels" (dict "root" $ "service" "inventory-service") | nindent 14 }}
      ports:
        - port: {{ (index $.Values.services "inventory-service").grpcPort }}
          protocol: TCP
    {{- end }}
    {{- with $.Values.networkPolicy.egress.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
