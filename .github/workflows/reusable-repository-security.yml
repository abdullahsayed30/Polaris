name: Reusable repository security

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact prefix from the quality job in this workflow run.
        required: false
        type: string
        default: polaris

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dependency SBOM from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name }}-dependency-sbom
          path: target

      - name: Verify tested source and SBOM provenance
        run: python3 .github/scripts/ci_source.py verify target

      - name: Scan resolved dependency SBOM once
        id: dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          version: v0.74.0
          scan-type: sbom
          scan-ref: target/polaris-sbom.json
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: 'true'
          format: json
          output: trivy-dependencies.json
          exit-code: '0'

      - name: Scan source secrets and misconfigurations once
        id: source
        run: |
          trivy --cache-dir .cache/trivy fs --ignorefile /dev/null --scanners secret,misconfig --pkg-types os --offline-scan \
            --format json --list-all-pkgs --exit-code 0 \
            --output trivy-source.json .

      - name: Combine native source and dependency finding records
        id: combined
        run: python3 .github/scripts/merge_trivy_results.py trivy-source.json trivy-dependencies.json trivy-repository.json

      - name: Verify Trivy conversion severity policy
        run: python3 .github/scripts/test_trivy_conversion.py

      - name: Convert full repository results to SARIF
        if: ${{ !cancelled() && hashFiles('trivy-repository.json') != '' }}
        run: trivy convert --ignorefile /dev/null --format sarif --output trivy-repository.sarif trivy-repository.json

      - name: Upload Trivy repository SARIF
        if: ${{ !cancelled() && hashFiles('trivy-repository.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        continue-on-error: true
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

      - name: Upload full repository security reports
        if: ${{ !cancelled() && hashFiles('trivy-source.json', 'trivy-dependencies.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}-repository-security
          path: |
            trivy-source.json
            trivy-dependencies.json
            trivy-repository.json
            trivy-repository.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsuppressed repository findings to run summary
        if: ${{ !cancelled() }}
        env:
          CI_ARTIFACT_PREFIX: ${{ inputs.artifact-name }}
          CI_SCAN_SUCCEEDED: ${{ steps.dependencies.outcome == 'success' && steps.source.outcome == 'success' && steps.combined.outcome == 'success' }}
        run: python3 .github/scripts/trivy_summary.py repository trivy-repository.json

      - name: Enforce HIGH and CRITICAL repository findings
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/trivy_gate.py trivy-repository.json
