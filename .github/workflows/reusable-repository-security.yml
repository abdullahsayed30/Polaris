name: Reusable repository security

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact prefix from the quality job in this workflow run.
        required: false
        type: string
        default: polaris

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download dependency SBOM from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact-name }}-dependency-sbom
          path: target

      - name: Verify tested source and SBOM provenance
        run: python3 .github/scripts/ci_source.py verify target

      - name: Scan resolved dependency SBOM once
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: sbom
          scan-ref: target/polaris-sbom.json
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          list-all-pkgs: 'true'
          format: json
          output: trivy-dependencies.json
          exit-code: '0'

      - name: Scan source secrets and misconfigurations once
        run: |
          trivy --cache-dir .cache/trivy fs --scanners secret,misconfig \
            --format json --list-all-pkgs --exit-code 0 \
            --output trivy-source.json .

      - name: Combine native source and dependency finding records
        run: python3 .github/scripts/merge_trivy_results.py trivy-source.json trivy-dependencies.json trivy-repository.json

      - name: Verify Trivy conversion severity policy
        run: python3 .github/scripts/test_trivy_conversion.py

      - name: Convert full repository results to SARIF
        if: ${{ !cancelled() && hashFiles('trivy-repository.json') != '' }}
        run: trivy convert --format sarif --output trivy-repository.sarif trivy-repository.json

      - name: Upload Trivy repository SARIF
        if: ${{ !cancelled() && hashFiles('trivy-repository.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

      - name: Upload full repository security reports
        if: ${{ !cancelled() && hashFiles('trivy-source.json', 'trivy-dependencies.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}-repository-security
          path: |
            trivy-source.json
            trivy-dependencies.json
            trivy-repository.json
            trivy-repository.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Enforce HIGH and CRITICAL repository findings
        if: ${{ !cancelled() }}
        run: trivy convert --format table --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 trivy-repository.json
