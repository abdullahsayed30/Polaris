name: Reusable quality and tests

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name prefix for uploaded CI artifacts.
        required: false
        type: string
        default: polaris
      run-integration-tests:
        description: Run Testcontainers-backed integration tests with Maven verify.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Confirm toolchain
        run: |
          java -version
          ./mvnw --version

      - name: Test CI failure handling and artifact provenance
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci.py' -v

      - name: Validate operational alert configuration and rule scenarios
        run: bash deploy/scripts/validate-alerts.sh

      - name: Run quality checks, all tests and packaging
        if: ${{ inputs.run-integration-tests }}
        run: |
          docker info > /dev/null
          ./mvnw -B -ntp spotless:check checkstyle:check verify

      - name: Run fast gate and packaging for a manual fast run
        if: ${{ !inputs.run-integration-tests }}
        run: |
          ./mvnw -B -ntp spotless:check checkstyle:check test
          ./mvnw -B -ntp -DskipTests package

      - name: Generate aggregate SBOM and source provenance
        run: |
          ./mvnw -B -ntp -DskipTests -DincludeTestScope=true cyclonedx:makeAggregateBom
          python3 .github/scripts/ci_source.py write target

      - name: Generate coverage reports after a failed build
        if: ${{ failure() }}
        run: ./mvnw -B -ntp -DskipTests jacoco:report

      - name: Publish test and coverage summary
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import glob
          import os
          import xml.etree.ElementTree as ET

          test_totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          report_paths = set(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True))
          report_paths.update(glob.glob("**/target/failsafe-reports/TEST-*.xml", recursive=True))
          for report_path in report_paths:
              suite = ET.parse(report_path).getroot()
              for name in test_totals:
                  test_totals[name] += int(suite.attrib.get(name, 0))

          covered_lines = 0
          missed_lines = 0
          for report_path in glob.glob("**/target/site/jacoco/jacoco.xml", recursive=True):
              report = ET.parse(report_path).getroot()
              line_counter = next(
                  (counter for counter in report.findall("counter") if counter.attrib.get("type") == "LINE"),
                  None,
              )
              if line_counter is not None:
                  covered_lines += int(line_counter.attrib["covered"])
                  missed_lines += int(line_counter.attrib["missed"])

          measured_lines = covered_lines + missed_lines
          coverage = f"{covered_lines / measured_lines:.1%}" if measured_lines else "n/a"
          summary = (
              "## Test and coverage summary\n\n"
              "| Tests | Failures | Errors | Skipped | Line coverage |\n"
              "| ---: | ---: | ---: | ---: | ---: |\n"
              f"| {test_totals['tests']} | {test_totals['failures']} | {test_totals['errors']} "
              f"| {test_totals['skipped']} | {coverage} |\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}-coverage-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload aggregate SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact-name }}-dependency-sbom
          path: |
            target/polaris-sbom.json
            target/ci-source.json
          if-no-files-found: error
          retention-days: 30
